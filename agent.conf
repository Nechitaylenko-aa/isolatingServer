# fcpp-agent configuration

# --- Paths ---
registry_path="/home/artem/.fcpp-agent/projects/registry.db"
db_dir="/home/artem/.fcpp-agent/db"
default_build="build"
compile_commands_path=""

# --- Tools (empty path = search in PATH) ---
tool_clang_path=""
tool_cmake_path=""
tool_ninja_path=""
tool_clang_tidy_path=""
enable_tidy="YES"

# --- Permissions (closed security model) ---
allow_read="YES"
allow_write="YES"
allow_exec="YES"

# --- LLM roles ---
