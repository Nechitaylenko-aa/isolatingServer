# cf-agent configuration (FreeBSD rc.conf style)
# Комментарии — с '#'.
#
# Модели: light — мышление (анализ/обобщение), main — кодер.
# Пока обе роли может исполнять одна модель: укажите 'same_as_main'
# у light (или 'same_as_light' у main).
model_main="http://127.0.0.1:8080"
model_main_name=""
model_light="same_as_main"
model_light_name=""
# remote — удалённая модель (задел, пока не используется)
model_remote_url="https://routerai.ru/api/v1"
model_remote_type="openai-compat"
model_remote_name="deepseek/deepseek-v3.2"
model_remote_key="sk-..."
# Где хранить БД (вне проектов) и как называть build-каталог по умолчанию
db_dir="/home/artem/.cf_agent/db"
default_build="build"

allow_read="YES"
allow_write="YES"
allow_exec="YES"
allow_subtasks="NO" # как думаешь, это может дать прирост/улучшение агента?
